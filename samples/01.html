<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Immersive 3D Platform</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.min.js"></script>
<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
overflow: hidden;
background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
color: white;
height: 100vh;
}

#canvas-container {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
z-index: 1;
}

.ui-overlay {
position: absolute;
z-index: 10;
padding: 20px;
}

.header {
top: 0;
left: 0;
width: 100%;
display: flex;
justify-content: space-between;
align-items: center;
background: rgba(0, 0, 0, 0.3);
backdrop-filter: blur(10px);
border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.logo {
font-size: 1.8rem;
font-weight: 700;
background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
padding: 0 20px;
}

.nav-buttons {
display: flex;
gap: 15px;
padding: 0 20px;
}

.btn {
background: rgba(255, 255, 255, 0.1);
border: 1px solid rgba(255, 255, 255, 0.2);
color: white;
padding: 10px 20px;
border-radius: 30px;
cursor: pointer;
transition: all 0.3s ease;
backdrop-filter: blur(10px);
}

.btn:hover {
background: rgba(255, 255, 255, 0.2);
transform: translateY(-2px);
box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
}

.btn-primary {
background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
border: none;
}

.sidebar {
right: 0;
top: 50%;
transform: translateY(-50%);
background: rgba(0, 0, 0, 0.3);
backdrop-filter: blur(10px);
border-radius: 20px 0 0 20px;
padding: 20px;
border: 1px solid rgba(255, 255, 255, 0.1);
border-right: none;
}

.tools {
display: flex;
flex-direction: column;
gap: 15px;
}

.tool-btn {
width: 50px;
height: 50px;
border-radius: 50%;
background: rgba(255, 255, 255, 0.1);
border: 1px solid rgba(255, 255, 255, 0.2);
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
transition: all 0.3s ease;
}

.tool-btn:hover {
background: rgba(255, 255, 255, 0.2);
transform: scale(1.1);
}

.gallery {
bottom: 20px;
left: 50%;
transform: translateX(-50%);
display: flex;
gap: 15px;
background: rgba(0, 0, 0, 0.3);
backdrop-filter: blur(10px);
padding: 15px;
border-radius: 30px;
border: 1px solid rgba(255, 255, 255, 0.1);
}

.gallery-item {
width: 80px;
height: 80px;
border-radius: 15px;
background: rgba(255, 255, 255, 0.1);
border: 2px solid rgba(255, 255, 255, 0.2);
cursor: pointer;
transition: all 0.3s ease;
overflow: hidden;
}

.gallery-item:hover {
transform: translateY(-5px);
border-color: #4ecdc4;
box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
}

.instructions {
bottom: 20px;
left: 20px;
background: rgba(0, 0, 0, 0.3);
backdrop-filter: blur(10px);
padding: 15px;
border-radius: 15px;
border: 1px solid rgba(255, 255, 255, 0.1);
max-width: 300px;
}

.instructions h3 {
margin-bottom: 10px;
color: #4ecdc4;
}

.instructions ul {
list-style: none;
}

.instructions li {
margin: 8px 0;
display: flex;
align-items: center;
}

.instructions li::before {
content: "•";
color: #ff6b6b;
margin-right: 10px;
}

.collaboration-panel {
top: 50%;
left: 20px;
transform: translateY(-50%);
background: rgba(0, 0, 0, 0.3);
backdrop-filter: blur(10px);
padding: 20px;
border-radius: 15px;
border: 1px solid rgba(255, 255, 255, 0.1);
max-width: 250px;
}

.collaborator {
display: flex;
align-items: center;
margin: 10px 0;
}

.avatar {
width: 30px;
height: 30px;
border-radius: 50%;
background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
margin-right: 10px;
}

.status-indicator {
width: 10px;
height: 10px;
border-radius: 50%;
background: #4ecdc4;
margin-left: auto;
}

@media (max-width: 768px) {
.sidebar, .collaboration-panel {
display: none;
}

.gallery {
width: 90%;
left: 5%;
transform: none;
}
}
</style>
</head>
<body>
<div id="canvas-container"></div>

<div class="ui-overlay header">
<div class="logo">IMMERSE3D</div>
<div class="nav-buttons">
<button class="btn">Gallery</button>
<button class="btn">Templates</button>
<button class="btn btn-primary">Share</button>
</div>
</div>

<div class="ui-overlay sidebar">
<div class="tools">
<div class="tool-btn" title="Add Cube">⬜</div>
<div class="tool-btn" title="Add Sphere">⭕</div>
<div class="tool-btn" title="Add Cylinder">◔</div>
<div class="tool-btn" title="Add Light">💡</div>
<div class="tool-btn" title="Add Text">T</div>
<div class="tool-btn" title="Paint Tool">🖌️</div>
</div>
</div>

<div class="ui-overlay gallery">
<div class="gallery-item"></div>
<div class="gallery-item"></div>
<div class="gallery-item"></div>
<div class="gallery-item"></div>
<div class="gallery-item"></div>
</div>

<div class="ui-overlay instructions">
<h3>Controls</h3>
<ul>
<li>Left Click + Drag: Rotate View</li>
<li>Right Click + Drag: Pan Camera</li>
<li>Scroll: Zoom In/Out</li>
<li>Double Click: Add Object</li>
</ul>
</div>

<div class="ui-overlay collaboration-panel">
<h3>Collaborators</h3>
<div class="collaborator">
<div class="avatar"></div>
<span>You</span>
<div class="status-indicator"></div>
</div>
<div class="collaborator">
<div class="avatar"></div>
<span>Alex Designer</span>
<div class="status-indicator"></div>
</div>
<div class="collaborator">
<div class="avatar"></div>
<span>Sam Creator</span>
<div class="status-indicator"></div>
</div>
</div>

<script>
// Initialize Three.js scene
let scene, camera, renderer, controls;
let objects = [];
let raycaster, mouse;

function init() {
// Create scene
scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a1a);
scene.fog = new THREE.Fog(0x0a0a1a, 20, 100);

// Create camera
camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 5, 10);

// Create renderer
renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.getElementById('canvas-container').appendChild(renderer.domElement);

// Add orbit controls
controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;

// Add lighting
const ambientLight = new THREE.AmbientLight(0x404040, 1);
scene.add(ambientLight);

const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
directionalLight.position.set(5, 10, 7);
directionalLight.castShadow = true;
scene.add(directionalLight);

const hemisphereLight = new THREE.HemisphereLight(0xffffbb, 0x080820, 0.5);
scene.add(hemisphereLight);

// Create floor
const floorGeometry = new THREE.PlaneGeometry(30, 30);
const floorMaterial = new THREE.MeshStandardMaterial({
color: 0x1e3d59,
roughness: 0.8,
metalness: 0.2
});
const floor = new THREE.Mesh(floorGeometry, floorMaterial);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// Add grid helper
const gridHelper = new THREE.GridHelper(30, 30, 0x4a4a6a, 0x2a2a4a);
scene.add(gridHelper);

// Add axis helper
const axesHelper = new THREE.AxesHelper(5);
scene.add(axesHelper);

// Create initial objects
createSampleObjects();

// Raycasting for interaction
raycaster = new THREE.Raycaster();
mouse = new THREE.Vector2();

// Event listeners
window.addEventListener('resize', onWindowResize);
document.addEventListener('dblclick', onMouseDoubleClick);
document.addEventListener('mousemove', onMouseMove);

// Start animation loop
animate();
}

function createSampleObjects() {
// Create sample objects
const geometries = [
new THREE.BoxGeometry(1, 1, 1),
new THREE.SphereGeometry(0.8, 32, 32),
new THREE.CylinderGeometry(0.5, 0.5, 1, 32),
new THREE.TorusGeometry(0.6, 0.2, 16, 100),
new THREE.ConeGeometry(0.7, 1.5, 32)
];

const colors = [0xff6b6b, 0x4ecdc4, 0xffe66d, 0x1a535c, 0xff9f1c];

for (let i = 0; i < 5; i++) {
const material = new THREE.MeshPhongMaterial({
color: colors[i],
shininess: 100,
emissive: 0x222222
});

const mesh = new THREE.Mesh(geometries[i], material);
mesh.position.set(
(i - 2) * 3,
Math.sin(i) + 1,
Math.cos(i) * 2
);
mesh.castShadow = true;
mesh.receiveShadow = true;

// Add subtle rotation animation
mesh.userData = { rotationSpeed: (Math.random() - 0.5) * 0.02 };

scene.add(mesh);
objects.push(mesh);
}

// Add floating platforms
for (let i = 0; i < 3; i++) {
const platformGeometry = new THREE.CylinderGeometry(1.5, 1.5, 0.2, 32);
const platformMaterial = new THREE.MeshStandardMaterial({
color: 0x2a9d8f,
transparent: true,
opacity: 0.7
});
const platform = new THREE.Mesh(platformGeometry, platformMaterial);
platform.position.set(
(i - 1) * 5,
0.1,
(i - 1) * 3
);
platform.rotation.y = i * Math.PI / 3;
platform.receiveShadow = true;
scene.add(platform);
}
}

function onMouseMove(event) {
// Calculate mouse position in normalized device coordinates
mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
}

function onMouseDoubleClick() {
// Add a new random object at camera position
const geometries = [
new THREE.BoxGeometry(0.5, 0.5, 0.5),
new THREE.SphereGeometry(0.4, 16, 16),
new THREE.ConeGeometry(0.3, 0.8, 16)
];

const colors = [0xff6b6b, 0x4ecdc4, 0xffe66d, 0x1a535c, 0xff9f1c];

const geometry = geometries[Math.floor(Math.random() * geometries.length)];
const material = new THREE.MeshPhongMaterial({
color: colors[Math.floor(Math.random() * colors.length)],
shininess: 80
});

const mesh = new THREE.Mesh(geometry, material);

// Position object in front of camera
const direction = new THREE.Vector3();
camera.getWorldDirection(direction);
mesh.position.copy(camera.position).add(direction.multiplyScalar(5));
mesh.castShadow = true;
mesh.receiveShadow = true;

scene.add(mesh);
objects.push(mesh);
}

function onWindowResize() {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
requestAnimationFrame(animate);

// Update controls
controls.update();

// Animate objects
objects.forEach(obj => {
if (obj.userData.rotationSpeed) {
obj.rotation.y += obj.userData.rotationSpeed;
}
});

// Render scene
renderer.render(scene, camera);
}

// Initialize the scene when the page loads
window.onload = init;
</script>
</body>
</html>
